# Kegerator display: a Hosyond 4.0" ESP32-32E board (the LCDWiki E32R40T): ST7796S 320x480 panel,
# XPT2046 resistive touch. This is the play-around config: a live readout of the CO2 scale, a
# backlight slider, and the onboard RGB LED. Pins are from the LCDWiki E32R40T demo PDF, table 2.1
esphome:
  name: kegerator-display
  friendly_name: Kegerator Display

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # the display is on usb power, so the wifi never naps; napping can delay or drop the scales'
  # readings
  power_save_mode: none

api:
  encryption:
    key: !secret api_encryption_key
  # the display works without Home Assistant, so it must not restart when HA isn't connected
  # (the default is to restart after 15 minutes)
  reboot_timeout: 0s

# lets the display be updated over wifi with `esphome run`
ota:
  - platform: esphome
    password: !secret ota_password

# the LCD and the touch chip share this bus, each with its own chip select. the SD card slot is on
# a separate bus (18/19/23, CS 5) and is not used here
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

display:
  - platform: mipi_spi
    id: lcd
    model: ST7796
    cs_pin: GPIO15
    dc_pin: GPIO2
    # no reset_pin: the panel's reset is tied to the ESP32's EN line. rotation is set in the lvgl
    # block, which won't take it here
    # if the colors come out as a photo negative, flip invert_colors. if red and blue are swapped,
    # change color_order to rgb
    invert_colors: false
    color_order: bgr
    data_rate: 40MHz
    # LVGL does the drawing, so the display keeps no frame buffer of its own
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    display: lcd
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    # placeholder numbers until it is calibrated: tap the four corners, read the raw values from the
    # log line below, and put the smallest and largest of each here
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw_x=%d raw_y=%d"
          args: [ 'touch.x', 'touch.y', 'touch.x_raw', 'touch.y_raw' ]

output:
  # backlight, lit when high
  - platform: ledc
    id: backlight_pwm
    pin: GPIO27
  # the RGB LED is common anode, so each color is lit when its pin is low
  - platform: ledc
    id: led_red_pwm
    pin: GPIO22
    inverted: true
  - platform: ledc
    id: led_green_pwm
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: led_blue_pwm
    pin: GPIO17
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms
  - platform: rgb
    id: status_led
    name: "Status LED"
    red: led_red_pwm
    green: led_green_pwm
    blue: led_blue_pwm
    restore_mode: ALWAYS_OFF

sensor:
  # the CO2 tank weight, read from Home Assistant
  - platform: homeassistant
    id: co2_weight
    entity_id: sensor.bar_kegerator_scale_co2_scale
    on_value:
      - lvgl.label.update:
          id: co2_label
          text:
            format: "%.1f lb"
            args: [ 'x' ]
      - lvgl.bar.update:
          id: co2_bar
          value: !lambda return x;

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

lvgl:
  displays: lcd
  touchscreens: touch
  # portrait, 320 wide and 480 tall. 180 is portrait upside down, 90 and 270 landscape. LVGL turns
  # the touch coordinates with it
  rotation: 0
  # the whole 480x320 screen at 16 bits is 300 KB, more than this ESP32 has free without PSRAM, so
  # LVGL draws it in strips. raise this if it has memory to spare, lower it if LVGL fails to start
  buffer_size: 15%
  # the colors from the mockups: near-black page, light text, amber accents, teal for CO2
  style_definitions:
    - id: card
      bg_color: 0x171A1F
      radius: 12
      border_width: 0
      pad_all: 12
  pages:
    - id: main_page
      bg_color: 0x0E1013
      # labels take their color from the page unless they set their own
      text_color: 0xF2EFE9
      widgets:
        - label:
            align: TOP_MID
            y: 12
            text: "ON TAP"
            text_font: montserrat_28
            text_color: 0xF2A33A
        - obj:
            styles: card
            align: CENTER
            width: 296
            height: 150
            widgets:
              - label:
                  align: TOP_LEFT
                  text: "CO2"
                  text_font: montserrat_20
              - label:
                  id: co2_label
                  align: TOP_RIGHT
                  text: "--"
                  text_font: montserrat_28
              # 0-15 lb is a placeholder range, set it to the empty and full readings of the tank
              - bar:
                  id: co2_bar
                  align: BOTTOM_MID
                  width: 270
                  height: 24
                  min_value: 0
                  max_value: 15
                  value: 0
                  bg_color: 0x262B33
                  indicator:
                    bg_color: 0x4FC3C9
        - slider:
            id: brightness_slider
            align: BOTTOM_MID
            y: -30
            width: 270
            min_value: 5
            max_value: 100
            value: 100
            bg_color: 0x262B33
            indicator:
              bg_color: 0xF2A33A
            knob:
              bg_color: 0xF2EFE9
            on_release:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda return x / 100.0;
