# copy this to secrets.yaml and fill it in; secrets.yaml is never committed

wifi_ssid: "your wifi name"
wifi_password: "your wifi password"

# lets Home Assistant talk to the display; make one with: openssl rand -base64 32
api_encryption_key: "paste a 32 byte base64 key here"

# needed to update the display over wifi
ota_password: "any password"
