# copy this to secrets.yaml and fill it in; secrets.yaml is never committed. Home Assistant's
# ESPHome Builder needs the same names in its own secrets.yaml

wifi_ssid: "your wifi name"
wifi_password: "your wifi password"

# each device has its own key; it encrypts the Home Assistant connection and the updates over
# wifi. Make each one with:
#   openssl rand -base64 32
kegerator_display_api_key: "paste a key here"
kegerator_scale_keg_1_api_key: "paste a key here"
kegerator_scale_keg_2_api_key: "paste a key here"
kegerator_scale_keg_3_api_key: "paste a key here"
kegerator_scale_co2_api_key: "paste a key here"
