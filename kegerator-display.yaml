# Kegerator display: a Hosyond 4.0" ESP32-32E board (the LCDWiki E32R40T): ST7796S 320x480 panel,
# XPT2046 resistive touch. Pins are from the LCDWiki E32R40T demo PDF, table 2.1. The overview shows
# the left, center and right taps and the CO2 tank; the design is in docs/DESIGN.md

substitutions:
  # a keg's percent turns orange below this
  low_keg_pct: "25"

  # the colors. The page is the beer bubbles texture (images/texture_bubbles.png); the cards are
  # dark glass over it
  page_color: "0x16181B"
  card_color: "0x0A0C0F"
  card_opa: "70%"
  text_color: "0xF2EFE9"
  muted_color: "0x9AA3AE"
  accent_color: "0xF2A33A"
  low_color: "0xFF8A4C"
  co2_color: "0x4FC3C9"
  track_color: "0x262B33"

  # the overview's layout, in pixels: three tap cards stacked, then the CO2 card, 8 apart
  screen_pad: "12"
  card_w: "296"
  card_h: "122"
  # the keg art's height, from tools/make_art.py
  keg_h: "96"
  co2_card_y: "402"
  co2_card_h: "64"

esphome:
  name: kegerator-display
  friendly_name: Kegerator Display
  # fills in the cards from the saved settings once everything has started
  on_boot:
    - priority: -100
      then:
        - script.execute: left_update
        - script.execute: center_update
        - script.execute: right_update
        - script.execute: co2_update

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # the display is on usb power, so the wifi never naps; napping can delay or drop the scales'
  # readings
  power_save_mode: none

api:
  encryption:
    key: !secret api_encryption_key
  # the display works without Home Assistant, so it must not restart when HA isn't connected
  # (the default is to restart after 15 minutes)
  reboot_timeout: 0s

# lets the display be updated over wifi with `esphome run`. Uploads are encrypted with the same key
# as the Home Assistant connection, which also proves who's sending them
ota:
  - platform: esphome
    encryption:

# the display's own settings page, at http://kegerator-display.local, for editing beer names from
# a phone; they can be edited in Home Assistant too. Keg weights are set on each scale
web_server:
  port: 80
  version: 3

# one package per tap: its beer name and style settings, and redrawing its card
packages:
  left: !include { file: taps/tap.yaml, vars: { tap: left, tap_title: Left } }
  center: !include { file: taps/tap.yaml, vars: { tap: center, tap_title: Center } }
  right: !include { file: taps/tap.yaml, vars: { tap: right, tap_title: Right } }

# the LCD and the touch chip share this bus, each with its own chip select. the SD card slot is on
# a separate bus (18/19/23, CS 5) and is not used here
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

display:
  - platform: mipi_spi
    id: lcd
    model: ST7796
    cs_pin: GPIO15
    dc_pin: GPIO2
    # no reset_pin: the panel's reset is tied to the ESP32's EN line. rotation is set in the lvgl
    # block, which won't take it here
    # if the colors come out as a photo negative, flip invert_colors. if red and blue are swapped,
    # change color_order to rgb
    invert_colors: false
    color_order: bgr
    data_rate: 40MHz
    # LVGL does the drawing, so the display keeps no frame buffer of its own
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    display: lcd
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    # from taps near the corners: raw x runs about 520 at the left to 3700 at the right, raw y
    # about 3800 at the top to 450 near the bottom. The bottom edge is estimated from that; if taps
    # there land off, adjust y_min. Raw y is high at the top, so y is flipped
    calibration:
      x_min: 400
      x_max: 3780
      y_min: 250
      y_max: 3850
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: true
    # a tap on the dark screen wakes it. it acts on lifting the finger, after LVGL has already
    # ignored the touch (it's paused), so the waking tap can't press anything
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

output:
  # backlight, lit when high
  - platform: ledc
    id: backlight_pwm
    pin: GPIO27

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms


# the CO2 tank: what it weighs empty (stamped "TW" on the collar) and how much gas it holds full
number:
  # how long the screen stays on after the last touch
  - platform: template
    id: screen_off_minutes
    name: "Screen off after"
    icon: mdi:monitor-off
    entity_category: config
    unit_of_measurement: min
    mode: box
    min_value: 1
    max_value: 60
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 2

  - platform: template
    id: co2_tank_tare
    name: "CO2 tank empty weight"
    icon: mdi:scale
    entity_category: config
    unit_of_measurement: lb
    mode: box
    min_value: 0
    max_value: 40
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: 7.5
    on_value:
      - script.execute: co2_update

  - platform: template
    id: co2_tank_size
    name: "CO2 tank size"
    icon: mdi:gas-cylinder
    entity_category: config
    unit_of_measurement: lb
    mode: box
    min_value: 1
    max_value: 20
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 5
    on_value:
      - script.execute: co2_update

globals:
  # worked out by co2_update; NAN until the scale's weight arrives
  - id: co2_gas
    type: float
    initial_value: 'NAN'
  - id: co2_pct
    type: float
    initial_value: 'NAN'

script:
  - id: co2_update
    mode: restart
    then:
      - lambda: |-
          const float weight = id(co2_weight).state;
          if (std::isnan(weight)) {
            id(co2_gas) = NAN;
            id(co2_pct) = NAN;
            return;
          }
          const float gas = std::max(0.0f, weight - id(co2_tank_tare).state);
          id(co2_gas) = gas;
          id(co2_pct) = std::min(100.0f, gas / id(co2_tank_size).state * 100.0f);
      - if:
          condition:
            lambda: 'return std::isnan(id(co2_pct));'
          then:
            - lvgl.label.update:
                id: co2_label
                text: "--"
            - lvgl.bar.update:
                id: co2_bar
                value: 0
          else:
            - lvgl.label.update:
                id: co2_label
                text:
                  format: "%.1f lb · %.0f%%"
                  args: [ 'id(co2_gas)', 'id(co2_pct)' ]
            - lvgl.bar.update:
                id: co2_bar
                value: !lambda 'return id(co2_pct);'

sensor:
  # what's left in each keg, worked out by its scale and read from Home Assistant for now (the
  # scales report once a minute); later it comes straight from the scales. Keg 1's scale is on the
  # left tap; the center and right taps have no scale yet, so they read nothing
  - platform: homeassistant
    id: left_gallons
    entity_id: sensor.bar_kegerator_scale_keg_1_gallons_left
    on_value:
      - script.execute: left_update
  - platform: homeassistant
    id: left_percent
    entity_id: sensor.bar_kegerator_scale_keg_1_percent_full
    on_value:
      - script.execute: left_update

  - platform: template
    id: center_gallons
    update_interval: never
  - platform: template
    id: center_percent
    update_interval: never

  - platform: template
    id: right_gallons
    update_interval: never
  - platform: template
    id: right_percent
    update_interval: never

  # the CO2 tank's weight; the display works out the gas left until the CO2 scale runs the new
  # firmware, which reports it itself
  - platform: homeassistant
    id: co2_weight
    entity_id: sensor.bar_kegerator_scale_co2_scale
    on_value:
      - script.execute: co2_update

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  # free RAM, to watch: the screen and the settings page share what this board has (no PSRAM)
  - platform: debug
    free:
      name: "Free memory"
    block:
      name: "Largest free block"

debug:
  update_interval: 30s

# the artwork, drawn by tools/make_art.py. The keg is drawn twice, empty and full; a tap card shows
# the full one up to the keg's level over the empty one
image:
  - platform: file
    file: images/texture_bubbles.png
    id: background_texture
    type: RGB565
  - platform: file
    file: images/keg_empty.png
    id: keg_empty
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: images/keg_full.png
    id: keg_full
    type: RGB565
    transparency: alpha_channel

# Barlow Condensed for numbers and names, Barlow for the small labels; only the characters each
# one needs are built in, to save flash
font:
  - file: "gfonts://Barlow Condensed@700"
    id: font_big
    size: 32
    bpp: 4
    glyphs: "0123456789.%- "

  - file: "gfonts://Barlow Condensed@600"
    id: font_name
    size: 22
    bpp: 4

  - file: "gfonts://Barlow Condensed@700"
    id: font_co2
    size: 20
    bpp: 4
    glyphsets: [ GF_Latin_Core ]
    # Barlow doesn't have the capital sharp s (ẞ) from this set, which no label uses
    ignore_missing_glyphs: true

  - file: "gfonts://Barlow@500"
    id: font_small
    size: 13
    bpp: 4
    glyphsets: [ GF_Latin_Core ]
    # Barlow doesn't have the capital sharp s (ẞ) from this set, which no label uses
    ignore_missing_glyphs: true

lvgl:
  displays: lcd
  touchscreens: touch
  # portrait, 320 wide and 480 tall. 180 is portrait upside down, 90 and 270 landscape. LVGL turns
  # the touch coordinates with it
  rotation: 0
  # the whole 480x320 screen at 16 bits is 300 KB, more than this ESP32 has free without PSRAM, so
  # LVGL draws it in strips. raise this if it has memory to spare, lower it if LVGL fails to start
  buffer_size: 15%
  # sleep: with no touch for "Screen off after" minutes, the backlight goes off and LVGL stops
  # drawing. the cards still take in new readings while it sleeps, and show them on waking
  on_idle:
    timeout: !lambda 'return id(screen_off_minutes).state * 60 * 1000;'
    then:
      - light.turn_off: backlight
      - lvgl.pause:
  style_definitions:
    - id: card
      bg_color: ${card_color}
      bg_opa: ${card_opa}
      # a faint light edge, so the cards stand off the background
      border_width: 1
      border_color: 0xFFFFFF
      border_opa: 16%
      # the default theme gives cards dark text, which would win over the page's light text
      text_color: ${text_color}
      radius: 14
      pad_all: 12
  pages:
    - id: main_page
      bg_color: ${page_color}
      bg_image_src: background_texture
      # labels take their color from the page unless they set their own
      text_color: ${text_color}
      widgets:
        - !include
            file: taps/tap_card.yaml
            vars: { tap: left, tap_label: LEFT, card_y: 12 }
        - !include
            file: taps/tap_card.yaml
            vars: { tap: center, tap_label: CENTER, card_y: 142 }
        - !include
            file: taps/tap_card.yaml
            vars: { tap: right, tap_label: RIGHT, card_y: 272 }

        - obj:
            styles: card
            scrollable: false
            x: ${screen_pad}
            y: ${co2_card_y}
            width: ${card_w}
            height: ${co2_card_h}
            widgets:
              - label:
                  align: TOP_LEFT
                  text: "CO2"
                  text_font: font_co2
              - label:
                  id: co2_label
                  align: TOP_RIGHT
                  text: "--"
                  text_font: font_co2
              - bar:
                  id: co2_bar
                  align: BOTTOM_MID
                  width: 272
                  height: 10
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: ${track_color}
                  radius: 5
                  indicator:
                    bg_color: ${co2_color}
                    radius: 5
