# a keg scale: turns the plate's weight into what's left in the keg, for Home Assistant (and from
# there Grafana) and the display. Every keg is a sixtel; the empty keg weight is a setting, since
# the homebrew and commercial kegs weigh different amounts empty

substitutions:
  # a sixtel holds 5.16 gal, and a gallon of beer weighs about 8.42 lb
  keg_size_gal: "5.16"
  beer_lb_per_gal: "8.42"
  # where the setting starts; an empty sixtel is somewhere around 14-17 lb
  default_empty_keg_lb: "15.0"

number:
  # the keg shell plus whatever hose weight rests on the scale, taken off the scale's reading
  - platform: template
    id: empty_keg_weight
    name: "Empty keg weight"
    icon: mdi:scale
    entity_category: config
    unit_of_measurement: lb
    mode: box
    min_value: 0
    max_value: 40
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: ${default_empty_keg_lb}
    on_value:
      - script.execute: weight_updated

sensor:
  - platform: template
    id: gallons_left
    name: "Gallons left"
    icon: mdi:beer
    unit_of_measurement: gal
    device_class: volume_storage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      const float weight = id(scale_weight).state;
      if (std::isnan(weight)) {
        return NAN;
      }
      // the substitution is a double, so std::max is told to work in floats
      return std::max<float>(0.0f, (weight - id(empty_keg_weight).state) / ${beer_lb_per_gal});

  - platform: template
    id: percent_full
    name: "Percent full"
    icon: mdi:gauge
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      const float gallons = id(gallons_left).state;
      if (std::isnan(gallons)) {
        return NAN;
      }
      return std::min<float>(100.0f, gallons / ${keg_size_gal} * 100.0f);

script:
  # runs on each minute's weight and when the empty keg weight changes
  - id: weight_updated
    mode: restart
    then:
      - component.update: gallons_left
      - component.update: percent_full
